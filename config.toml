# Settings for live_camera.py
#
# Edit the values below, save, and run:  python live_camera.py
# Any command-line option overrides the value here for that run only,
# e.g.  python live_camera.py --frames 2
#
# The API key does NOT go here. Put QWEN_API_KEY in your .env file.
# Text values need quotes. For Windows paths use single quotes: 'C:\videos\clip.mp4'


# ------------------------------------------------------------ input

# 0 = default webcam, 1 = second camera, or a video file / stream URL.
source = 0

# true = analyse every part of a video file, segment by segment (video files only).
# false = live mode: play in real time and analyse a recent burst every few seconds.
full = false


# ------------------------------------------------------------ model / provider

# OpenAI-compatible API address. Local Ollama: http://localhost:11434/v1
#                                Local vLLM:   http://localhost:8000/v1
base_url = "http://localhost:11434/v1"

# Model name as your server or provider knows it.
model = "qwen3-vl:8b"

# Maximum length of each answer, in tokens. Raise it if answers come back empty
# (thinking models can use up all the tokens on reasoning).
max_tokens = 800

# 0 = most consistent answers, higher (e.g. 0.7) = more varied wording.
temperature = 0.2

# Seconds to wait for an answer before giving up.
timeout = 120

# Send the previous description so the model can say what changed.
# Set to false if the model keeps commenting on its earlier answers.
use_previous = true

# Instructions given to the model. The app still asks for the answer as JSON
# with "objects" and "description", so keep the prompt about describing frames.
system_prompt = """
You are a live camera assistant. You receive consecutive frames from a camera, \
oldest first. Identify the main objects that are visible and explain what is \
happening, including any movement or change between frames. Be concise and \
only describe what you can actually see.\
"""


# ------------------------------------------------------------ frames sent

# Frames sent per analysis. Fewer = faster and cheaper, more = better at motion.
frames = 4

# Frames are shrunk so their longest side is at most this many pixels.
# Smaller = faster and cheaper, larger = can read smaller text.
max_side = 640

# JPEG quality of the frames sent, 1-100.
jpeg_quality = 80


# ------------------------------------------------------------ live mode (full = false)

# Seconds to wait after each answer before the next analysis.
# 0 = only analyse when you press space.
interval = 3

# Seconds between the frames in each burst (frames = 4 and frame_gap = 0.5
# covers about 1.5 seconds).
frame_gap = 0.5

# Draw YOLO object boxes and pass the labels to Qwen as hints.
# "" = off, "yolov8n.pt" = on (needs: pip install ultralytics).
yolo = ""

# Stop after this many seconds. 0 = run until you quit.
max_runtime = 0


# ------------------------------------------------------------ full mode (full = true)

# Length of each analysed segment in seconds. The video is split into
# back-to-back segments of this length, and frames are spread evenly in each.
segment = 5


# ------------------------------------------------------------ output

# Show the video window. false = just print the results.
display = true

# The window is shrunk to fit this width (and a 16:9 height) so the text stays
# on screen for large videos. Only affects the window, not what is sent to Qwen.
# 0 = show at the video's original size.
window_width = 1280

# Save every result as a JSON line to this file. "" = off.
log = ""

# Save descriptions as a subtitle file (video files only). "" = off.
srt = ""


# ------------------------------------------------------------ extra request fields

# Sent with every request, for provider-specific options. Leave empty if unsure.
# Example for vLLM to turn off Qwen3 thinking (faster answers):
#   chat_template_kwargs = { enable_thinking = false }
[extra_body]
